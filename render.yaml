services:
  - type: web
    name: av-design
    runtime: node
    region: frankfurt
    # El plan gratuito duerme el servicio tras 15 min de inactividad y el primer
    # acceso tarda. Si lo va a abrir un técnico en obra, subir a starter.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
